[package]
name = "rhu-harness"
version = "0.1.0"
edition = "2024"
description = "Gate runner for the RHU verification tier: builds, runs, and asserts the QEMU gate chain, emitting schema-1 structured results."
license = "MIT OR Apache-2.0"

# The crate stands alone: a workspace manifest in a directory above a
# checkout must not claim it (cargo stops its upward search here).
[workspace]

[[bin]]
name = "rhu-gate"
path = "src/main.rs"

# The harness takes no crate dependencies: the verification tier must build
# on a consumer machine from the bare pinned toolchain, so everything here
# is the standard library (the results validator set the precedent).
[dependencies]

[profile.release]
opt-level = 2
