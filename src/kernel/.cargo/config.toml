[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
rustflags = [
  # The board linker script arrives from build.rs as a link argument.
  # --nmagic: no page-alignment padding -- a flat MCU image.
  "-C", "link-arg=--nmagic",
]

# The ARMv8-M mainline leg (QEMU an505, Cortex-M33) -- same flags; the
# board linker script still arrives from build.rs.
# The Cortex-M33 target's key in the form cargo reads: cargo looks a target up as a dotted
# path, so a quoted dotted triple is one name it never walks and the flags under it never
# reached the M33 links (measured on the toolchain of record: the M33 compiler lines
# carried no --nmagic under the quoted key and carry it under this one; the images' loadable
# bytes and program headers identical either way).
[target.thumbv8m.main-none-eabihf]
rustflags = [
  "-C", "link-arg=--nmagic",
]
