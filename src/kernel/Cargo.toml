[package]
name = "rhu-kernel"
version = "0.2.0"
edition = "2024"
description = "The Lamella RHU kernel: a runtime-hosting unikernel for .NET (NativeAOT) on Cortex-M microcontrollers."
license = "MIT OR Apache-2.0"

# A manifest of its own: the empty workspace table stops cargo's upward
# search, so a checkout placed under a directory that carries a workspace
# manifest still builds (the crates of this tree target different machines
# and share nothing; a root workspace is refused by design).
[workspace]

[[bin]]
name = "rhu-kernel"
path = "src/main.rs"

# The whole kernel lives in the lib target: rlib for the bin above,
# staticlib for the external-linker payload merge (frozen ILC object +
# librhu_kernel.a under `ld -T payload-<board>.x`).
[lib]
name = "rhu_kernel"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

# The kernel takes no crate dependencies: it owns the vector table and
# the UsageFault/SVC/PendSV exception seams outright, so no runtime
# crate may own them first.
[dependencies]

[features]
default = ["qemu-exit", "board-mps2-an500"]
# Exactly one board feature must be selected (src/board/mod.rs enforces).
# The boards in the registry's order: the emulator rows first, then the
# silicon rows by maker and model.
board-mps2-an500 = []
# QEMU mps2-an505 (Cortex-M33, ARMv8-M mainline): the architecture leg.
# Secure-flat TrustZone posture -- the M33 boots Secure and the kernel
# stays there (no SAU programming, no NS transition). Build with
# --target thumbv8m.main-none-eabihf.
board-mps2-an505 = ["fpemul"]
# Pimoroni Pico Plus 2 (RP2350B; the same chip module as the Pico 2; no
# wireless module): the same build shape as the Pico 2's.
board-pimoroni-pico-plus-2 = ["fpemul"]
# Pico Plus 2 clock posture 2: the same PLL150 posture on that board;
# requires board-pimoroni-pico-plus-2.
pimoroni-pico-plus-2-pll150 = []
# Pimoroni Pico Plus 2 W (RP2350B; the same chip module as the Pico 2;
# the wireless module's lines are the wifi driver's): the same build
# shape as the Pico 2's.
board-pimoroni-pico-plus-2-w = ["fpemul"]
# Pico Plus 2 W clock posture 2: the same PLL150 posture on that board;
# requires board-pimoroni-pico-plus-2-w.
pimoroni-pico-plus-2-w-pll150 = []
# Raspberry Pi Pico 2 (RP2350A, Cortex-M33 silicon, execute-in-place from
# the QSPI flash at 0x10000000): build with --no-default-features (no
# semihosting exits off the bench) and --target thumbv8m.main-none-eabihf.
board-rpi-pico2 = ["fpemul"]
# Pico 2 clock posture 2: the system PLL at 150 MHz (the chip's rated
# clock). A gated posture -- own image names, own goldens, banner line
# from register read-back; requires board-rpi-pico2 (src/board/mod.rs
# refuses otherwise). Without it the board runs the boring 12 MHz
# crystal default.
rpi-pico2-pll150 = []
# Raspberry Pi Pico 2 W (the Pico 2 with a wireless module fitted, whose
# lines are the wifi driver's; the same chip and flash): the same build
# shape as the Pico 2's.
board-rpi-pico2-w = ["fpemul"]
# Pico 2 W clock posture 2: the same PLL150 posture on that board;
# requires board-rpi-pico2-w.
rpi-pico2-w-pll150 = []
# NUCLEO-L4R5ZI (STM32L4R5ZI, Cortex-M4 silicon with a single-precision
# FPU, flash-boot at 0x08000000; the STM32L4+ family's first board,
# hosting the kernel alone): build with --no-default-features (no
# semihosting exits off the bench) and --target thumbv7em-none-eabihf.
board-st-nucleo-l4r5zi = ["fpemul"]
# L4R5ZI clock posture 2: the main PLL at 120 MHz (the part's ceiling,
# under the regulator's boost mode). A gated posture -- own image names,
# own goldens, banner line from register read-back; requires
# board-st-nucleo-l4r5zi (src/board/mod.rs refuses otherwise). Without it
# the board runs the boring HSI16 default.
st-nucleo-l4r5zi-pll120 = []
# NUCLEO-U5A5ZJ-Q (STM32U5A5ZJ, Cortex-M33 silicon, flash-boot at
# 0x08000000, TrustZone option bit off): build with
# --no-default-features (no semihosting exits off the bench) and
# --target thumbv8m.main-none-eabihf.
board-st-nucleo-u5a5zj-q = ["fpemul"]
# U5A5 clock posture 2: PLL1 at 160 MHz (the range-1 ceiling posture). A
# gated posture -- own image names, own goldens, banner line from
# register read-back; requires board-st-nucleo-u5a5zj-q (src/board/mod.rs
# refuses otherwise). Without it the board runs the boring HSI16 default.
st-nucleo-u5a5zj-q-pll160 = []
# STM32F746G-DISCO (Cortex-M7 silicon, flash-boot at 0x08000000; the F7
# family's second board, hosting the kernel alone): build with
# --no-default-features (no semihosting exits off the bench).
board-st-stm32f746g-disco = ["fpemul"]
# F746 clock posture 2: PLL at 216 MHz (the production clock), the same
# recipe as the F769's; requires board-st-stm32f746g-disco (src/board/mod.rs
# refuses otherwise). Without it the board runs the boring HSI-16 default.
st-stm32f746g-disco-pll216 = []
# STM32F769I-DISCO (Cortex-M7 silicon, flash-boot at 0x08000000): build
# with --no-default-features (no semihosting exits off the bench).
board-st-stm32f769i-disco = []
# F769 clock posture 2: PLL at 216 MHz (the production clock). A gated
# posture -- own image names, own goldens, banner line from register
# read-back; requires board-st-stm32f769i-disco (src/board/mod.rs refuses
# otherwise). Without it the board runs the boring HSI-16 default.
st-stm32f769i-disco-pll216 = []
# Semihosting exits on the shutdown/panic/fault paths. QEMU runs only:
# without a debugger attached, BKPT #0xAB escalates to HardFault on real
# silicon, so non-QEMU builds disable this and every exit becomes a park.
qemu-exit = []
# The entropy opt-in: the cryptographic door serves the software stream on
# an image that names this feature (the emulator rows' gate images, where
# no hardware noise source exists); the boot banner says so. Off by default,
# implied by no board feature, never named on a silicon image by the build
# machinery -- a developer who names it on one gets the same honest banner.
entropy-accept-software = []
# Gate flavors: deliberately exercise the panic / fault path after the
# selftests pass.
test-panic = []
test-fault = []
# The designed death: corrupt a free kheap header, walk, die loud.
test-kheap-loud = []
# The stack-overflow designed death (v8-M rows only; a v7-M target refuses
# the flavor at compile time): a thread descends past its stack floor and
# the limit register must raise the UsageFault with the overflow line.
test-stackovfl = []
# The tick-cost measurement flavor (QEMU an500 + the
# Deterministic icount profile only): raw dns/dms/dsw numbers, never a
# gate case, never golden'd, never a silicon flavor.
test-tickcost = []
# Gate flavor: multithreaded smoke (sleep ordering, round-robin + tick
# preemption, callee-saved FP survival beside a hostile peer).
sched-smoke = []
# Gate flavor: hosting-API smoke (tick quiescence: a solo thread runs
# tick-free while the tick clock advances).
api-smoke = []
# Payload hosting: the import surface the hosted minirt payloads bind
# against, plus the managed entry sequence. The image only exists via
# the external payload link (staticlib + frozen ILC object).
payload = []
# The double-precision emulation for the single-precision FPU class: the fault
# funnel computes the double-precision forms in software and resumes the
# program. The Cortex-M33 boards imply it.
fpemul = []
# The emulation's decoder with the add and subtract operations swapped: the
# api gate's negative control, never a shipped image.
test-fpemul-doctored = []
# The cost of one double-precision form on a row with a cycle counter, printed by
# the api flavor's fp-cost check: a measurement image for a board flight, never a
# chain row.
fp-cost = []
# The GPIO doors' two doctored controls (the device seam), never a shipped image:
# on the emulator rows the virtual loopback latch fires the input's event twice
# per change; on a board the family handler's pending-mask clear is removed.
test-gpio-doctored-latch = []
test-gpio-doctored-mask = []
# The bus doors' doctored control (the emulator rows only), never a shipped
# image: the sensor model refuses the second data byte of a write, the I2C
# block model never completes a non-last message, and the drivers' pumps
# run unbounded so the receive queue's honest overflow loses bytes.
test-bus-doctored = []
# The GPIO acceptance flight's image on the boards with a button row (never a shipped image):
# the LED row blinked for the eye, then a bounded wait for a press that lights it.
test-gpio-button = []
# The unhosted-main flavor: an image whose kmain thread, after the selftests,
# calls a main the program defines (`rhu_unhosted_main`) instead of hosting a
# runtime, and exits with the code it returns. The kernel declares that main
# and never defines it, so an image with this feature links only against the
# program that defines it; a measurement image for a board flight, never a
# chain row. Without the feature the kernel moves by nothing.
unhosted-main = []

[profile.release]
opt-level = 2
debug = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"
