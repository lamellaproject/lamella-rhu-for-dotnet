[package]
name = "rhu-kernel-host"
version = "0.1.0"
edition = "2024"
description = "The Lamella RHU kernel's arithmetic modules and the handshake's judge, compiled from their own source files and exercised on the host toolchain."
license = "MIT OR Apache-2.0"

# A manifest of its own (see the kernel's): the empty workspace table
# stops cargo's upward search.
[workspace]

[lib]
name = "rhu_kernel_host"
path = "src/lib.rs"

# One dependency, the network stack's: the tier's net_math cases pin the kernel's
# checksum arithmetic against the vendored stack's own parser (the same
# release and features the kernel takes behind its `net` feature, read
# from src/vendor/crates by the crate-local cargo config); the rest of
# the tier is the kernel's own pure code and the standard library's test
# harness.
[dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns"] }

# The kernel's own feature names the included modules mention in their
# configuration attributes, declared so the compiler knows them; the tier
# never enables one.
[features]
api-smoke = []
payload = []
test-kheap-loud = []
test-fpemul-doctored = []
